name: 2dfan 自动签到

on:
  schedule:
    # UTC 1:10，即北京时间每日 09:10（签到周期 00:00 重置，且避开整点高峰）
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          python-version: "3.13"

      - name: 安装 Python 依赖
        run: uv sync

      - name: 安装 Xvfb（有头模式所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          google-chrome --version

      - name: 执行签到（Xvfb 虚拟显示器，Chrome 以有头模式运行）
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" uv run python main.py

      - name: 上传调试快照（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
